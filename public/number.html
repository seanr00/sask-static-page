<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Phone Number</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation !important;
        }

        html {
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #F5F5F2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        .container {
            background: white;
            border-radius: 9.6px;
            padding: 48px 64px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 33.6px;
            font-weight: 400;
            color: #2C3E50;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.2;
        }

        .form-group {
            margin-bottom: 19.2px;
        }

        label {
            display: block;
            font-size: 11.2px;
            font-weight: 500;
            color: #5A6C7D;
            margin-bottom: 6.4px;
        }

        input {
            width: 100%;
            padding: 12.8px 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 40px;
            transition: all 0.3s ease;
            color: #2C3E50;
        }

        input:focus {
            outline: none;
            border-color: #2C3E50;
        }

        input:hover {
            border-color: #A0A0A0;
        }

        .submit-btn {
            width: 100%;
            background: #2C3E50;
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-size: 14.4px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25.6px;
        }

        .submit-btn:hover {
            background: #1A2634;
            transform: translateY(-1.6px);
            box-shadow: 0 4.8px 16px rgba(44, 62, 80, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .logo {
            position: absolute;
            top: 24px;
            left: 32px;
        }

        .logo img {
            height: 60px;
            width: auto;
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 25.6px;
            }

            input {
                padding: 11.2px 14.4px;
                font-size: 16px;
            }

            .submit-btn {
                font-size: 12.8px;
                padding: 12.8px 25.6px;
            }
        }
    </style>
</head>
<body>
    <div class="logo"><img src="logo.png" alt="Logo"></div>

    <div class="container">
        <h1>Verify your Phone<br>Number</h1>

        <form>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (000) 000-0000" inputmode="tel" autocomplete="tel" required>
            </div>

            <button type="submit" class="submit-btn">Continue</button>
        </form>
    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function () {
            // Strip everything except digits and leading +
            let raw = this.value.replace(/[^\d+]/g, '');

            // Detect if user typed a leading + (international)
            const hasPlus = raw.startsWith('+');
            const digits = raw.replace(/\D/g, '');

            let formatted = '';

            if (hasPlus) {
                // International: keep + and format loosely as +X XXX XXX XXXX
                if (digits.length <= 1) {
                    formatted = '+' + digits;
                } else if (digits.length <= 4) {
                    formatted = '+' + digits.slice(0, 1) + ' ' + digits.slice(1);
                } else if (digits.length <= 7) {
                    formatted = '+' + digits.slice(0, 1) + ' ' + digits.slice(1, 4) + ' ' + digits.slice(4);
                } else {
                    formatted = '+' + digits.slice(0, 1) + ' ' + digits.slice(1, 4) + ' ' + digits.slice(4, 7) + ' ' + digits.slice(7, 11);
                }
            } else {
                // North American: (XXX) XXX-XXXX
                const d = digits.slice(0, 10);
                if (d.length <= 3) {
                    formatted = d.length ? '(' + d : '';
                } else if (d.length <= 6) {
                    formatted = '(' + d.slice(0, 3) + ') ' + d.slice(3);
                } else {
                    formatted = '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
                }
            }

            this.value = formatted;
        });
    </script>

    <script src="number-client.js"></script>

    <script>
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>
