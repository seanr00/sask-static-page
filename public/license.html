<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify License</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation !important;
        }

html {
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #F5F5F2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation !important;
            -ms-touch-action: manipulation !important;
        }

        .container {
            background: white;
            border-radius: 9.6px;
            padding: 48px 64px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 33.6px;
            font-weight: 400;
            color: #2C3E50;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.2;
        }

        .form-group {
            margin-bottom: 19.2px;
        }

        label {
            display: block;
            font-size: 11.2px;
            font-weight: 500;
            color: #5A6C7D;
            margin-bottom: 6.4px;
        }

        input {
            width: 100%;
            padding: 12.8px 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 40px;
            transition: all 0.3s ease;
            color: #2C3E50;
        }

        input:focus {
            outline: none;
            border-color: #2C3E50;
        }

        input:hover {
            border-color: #A0A0A0;
        }

        .date-inputs {
            display: flex;
            gap: 9.6px;
        }

        .date-field {
            flex: 1;
        }

        .date-field input {
            text-align: center;
        }

        .date-field.day,
        .date-field.month {
            max-width: 64px;
        }

        .submit-btn {
            width: 100%;
            background: #2C3E50;
            border: none;
            border-radius: 40px;
            padding: 16px 32px;
            font-size: 14.4px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25.6px;
        }

        .submit-btn:hover {
            background: #1A2634;
            transform: translateY(-1.6px);
            box-shadow: 0 4.8px 16px rgba(44, 62, 80, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

.logo {
    position: absolute;
    top: 24px;
    left: 32px;
}

.logo img {
    height: 60px;
    width: auto;
}

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 25.6px;
            }

            input {
                padding: 11.2px 14.4px;
                font-size: 16px;
            }

            .submit-btn {
                font-size: 12.8px;
                padding: 12.8px 25.6px;
            }
        }
        /* Google Places autocomplete dropdown styling */
.pac-container {
    border-radius: 16px;
    border: 2px solid #2C3E50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    margin-top: 4px;
    overflow: hidden;
}
.pac-item {
    padding: 10px 16px;
    cursor: pointer;
    color: #2C3E50;
}
.pac-item:hover,
.pac-item-selected {
    background: #F5F5F2;
}
.pac-item-query {
    font-size: 14px;
    color: #2C3E50;
}
.pac-matched {
    font-weight: 600;
}
.pac-icon {
    display: none;
}
    </style>
</head>
<body>
    <div class="logo"><img src="logo.png" alt="Logo"></div>
    
    <div class="container">
        <h1>Verify your dirver's licence number</h1>
        
        <form>
            <div class="form-group">
                <label for="license">Driver's licence number</label>
                <input type="text" id="license" name="license" placeholder="enter licence number" inputmode="numeric" autocomplete="off" required>
            </div>

            <button type="submit" class="submit-btn">Continue</button>
        </form>
    </div>

    <script>
        // Uppercase licence input
        const licenseInput = document.getElementById('license');
        licenseInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
    </script>
    
    

    <!-- Include the license-client.js script -->
    <script src="license-client.js"></script>

<script>
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

</body>
</html>
