<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .card h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f0f0f0;
    }

    .card p {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      padding: 12px 44px 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3498db;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }

    .toggle-pw:hover { color: #aaa; }

    .error-msg {
      display: none;
      background: rgba(231,76,60,0.15);
      border: 1px solid rgba(231,76,60,0.4);
      color: #e74c3c;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .error-msg.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #2980b9; }
    button[type="submit"]:active { transform: translateY(1px); }
    button[type="submit"]:disabled { background: #1a5276; cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <p>Enter your password to access the dashbord.</p>

    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••••••••" autocomplete="current-password">
      <button class="toggle-pw" type="button" id="toggle-pw" title="Show/hide password">👁</button>
    </div>

    <div class="error-msg" id="error-msg">Incorrect password. Please try again.</div>

    <button type="submit" id="login-btn">Sign In</button>
  </div>

  <script>
    // If already logged in, skip straight to dashbord
    if (localStorage.getItem('adminToken') === 'authenticated') {
      window.location.replace('/dashbord.html');
    }

    const passwordInput = document.getElementById('password');
    const loginBtn      = document.getElementById('login-btn');
    const errorMsg      = document.getElementById('error-msg');
    const toggleBtn     = document.getElementById('toggle-pw');

    // Show/hide password toggle
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? '🙈' : '👁';
    });

    // Allow Enter key to submit
    passwordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });

    loginBtn.addEventListener('click', attemptLogin);

    async function attemptLogin() {
      const password = passwordInput.value;
      if (!password) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Checking…';
      errorMsg.classList.remove('visible');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', 'authenticated');
          window.location.replace('/dashbord.html');
        } else {
          errorMsg.classList.add('visible');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Server error. Please try again.';
        errorMsg.classList.add('visible');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
