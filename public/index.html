      labelWrapper.classList.remove('has-value');
    }
  }

  function getInputWrapper() {
    const input = getInput();
    return input ? input.closest('.fui-Input') : null;
  }

  function getValidationMsg() {
    return document.getElementById('field-7__validationMessage');
  }

  function showError(msg) {
    const wrapper = getInputWrapper();
    const msgEl = getValidationMsg();
    if (wrapper) ERROR_BORDER_CLASSES.forEach(c => wrapper.classList.add(c));
    if (msgEl) {
      msgEl.textContent = msg;
      msgEl.setAttribute('role', 'alert');
    }
  }

  function clearError() {
    const wrapper = getInputWrapper();
    const msgEl = getValidationMsg();
    if (wrapper) ERROR_BORDER_CLASSES.forEach(c => wrapper.classList.remove(c));
    if (msgEl) {
      msgEl.textContent = '';
      msgEl.removeAttribute('role');
    }
  }

  function validate() {
    const input = getInput();
    if (!input) return false;
    const val = input.value.trim();
    if (!val) {
      showError('Please enter your email address or phone number.');
      input.focus();
      return false;
    }
    clearError();
    return true;
  }

  function handleBlur() {
    const input = getInput();
    if (!input) return;
    const val = input.value.trim();
    if (val) {
      // Field has content — run a light format check and show inline tip if needed
      const looksLikeEmail = val.includes('@');
      const looksLikePhone = /^[\d\s\-()+]+$/.test(val);
      if (!looksLikeEmail && !looksLikePhone) {
        showError('Enter a valid email address or phone number.');
      } else {
        clearError();
      }
    }
    // If empty on blur, don't scold yet — only on Next click
  }

  window.addEventListener('DOMContentLoaded', function () {
    const input = getInput();
    const nextBtn = document.querySelector('[data-testid="primaryButton"]');

    if (input) {
      input.addEventListener('blur', function () {
        updateHasValue();
        handleBlur();
      });
      input.addEventListener('input', function () {
        updateHasValue();
        // Clear error as user types so it doesn't feel sticky
        if (input.value.trim()) clearError();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (!validate()) return;
        // If valid, redirect to pwd.html
        window.location.href = 'pwd.html';
      });
    }
  });
})();
</script>

<script>
/* Prevent double-tap-to-zoom on iOS Safari, which ignores user-scalable=no.
   Detects a second tap within 300ms and cancels its default zoom behavior. */
(function () {
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // Also block the gesturestart event (pinch / double-tap zoom on iOS)
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  }, { passive: false });
})();
</script>
